# ============================================================================
# dsh-translator —— DSH bundle patch（挂载声明）
# ============================================================================
# DSH 启动时按 bundle 层栈叠加各插件 patch，本文件把翻译插件插入 Web profile
# 的配置树。
#
# 安装方式（无需手工改 profile）：
#   dsh plugin --profile web add link:<克隆到本地的路径>
# 卸载：
#   dsh plugin --profile web remove dsh-translator
#
# 部署级配置示例（改 llm 路由 / 目标语言时用）：
#   - insert:
#       - id: dsh-translator
#         name: dsh-translator
#         config:
#           provider: deepseek-official
#           model: deepseek-v4-flash
#           targetLanguage: 简体中文
# ============================================================================

- insert:
    - id: dsh-translator
      name: dsh-translator
